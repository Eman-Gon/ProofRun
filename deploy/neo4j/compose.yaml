name: proofrun-neo4j

services:
  neo4j:
    image: neo4j:5.26.31-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your private environment}"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    mem_limit: 2g
    cpus: "2.0"
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell --address bolt://localhost:7687 --username neo4j
          --password "$${NEO4J_AUTH#*/}" 'RETURN 1' > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  data:
